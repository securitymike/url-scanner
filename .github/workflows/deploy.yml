name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    # Skipped until ./scripts/setup-github-oidc.ps1 has set the repository variables.
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchange with Azure; no stored credentials
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      FUNCTION_APP: ${{ vars.AZURE_FUNCTION_APP_NAME }}
      STATIC_WEB_APP: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build API package
        working-directory: api
        run: |
          npm ci --omit=dev
          zip -qr ../api.zip . -x 'test/*' 'local.settings.json*' '.funcignore'

      - name: Deploy Function App
        run: |
          az functionapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP" --src api.zip

      - name: Prepare frontend
        run: |
          mkdir -p dist
          cp -r frontend/. dist/
          sed -i "s/__TENANT_ID__/${{ vars.AZURE_TENANT_ID }}/" dist/staticwebapp.config.json

      - name: Fetch Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
